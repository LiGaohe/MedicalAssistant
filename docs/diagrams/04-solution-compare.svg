<svg xmlns="http://www.w3.org/2000/svg" width="850" height="180" viewBox="0 0 850 180">
  <!-- 背景 -->
  <rect width="850" height="180" fill="#F8F7F2"/>
  
  <!-- 难点1：医疗术语识别率低 -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="#FDEDEC" stroke="#E74C3C" stroke-width="2"/>
    <text x="110" y="20" text-anchor="middle" font-size="11" fill="#C0392B" font-weight="bold" font-family="Noto Serif SC, serif">难点1</text>
    <text x="110" y="40" text-anchor="middle" font-size="10" fill="#333" font-family="Noto Serif SC, serif">医疗术语识别率低</text>
    <text x="110" y="53" text-anchor="middle" font-size="9" fill="#666" font-family="Noto Serif SC, serif">药名、病名识别不准确</text>
  </g>
  
  <!-- 箭头1 -->
  <g transform="translate(255, 50)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#27AE60" stroke-width="3" marker-end="url(#greenArrow)"/>
  </g>
  
  <!-- 方案1 -->
  <g transform="translate(310, 20)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="#E8F8F0" stroke="#27AE60" stroke-width="2"/>
    <text x="110" y="20" text-anchor="middle" font-size="11" fill="#196F3D" font-weight="bold" font-family="Noto Serif SC, serif">解决方案</text>
    <text x="110" y="40" text-anchor="middle" font-size="10" fill="#333" font-family="Noto Serif SC, serif">热词表 + 拼音纠错</text>
    <text x="110" y="53" text-anchor="middle" font-size="9" fill="#666" font-family="Noto Serif SC, serif">SeACo热词定制 + 规则匹配</text>
  </g>
  
  <!-- 难点2：长音频处理 -->
  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="#FDEDEC" stroke="#E74C3C" stroke-width="2"/>
    <text x="110" y="20" text-anchor="middle" font-size="11" fill="#C0392B" font-weight="bold" font-family="Noto Serif SC, serif">难点2</text>
    <text x="110" y="40" text-anchor="middle" font-size="10" fill="#333" font-family="Noto Serif SC, serif">长音频内存溢出</text>
    <text x="110" y="53" text-anchor="middle" font-size="9" fill="#666" font-family="Noto Serif SC, serif">音频>30s可能溢出</text>
  </g>
  
  <!-- 箭头2 -->
  <g transform="translate(255, 130)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#27AE60" stroke-width="3" marker-end="url(#greenArrow)"/>
  </g>
  
  <!-- 方案2 -->
  <g transform="translate(310, 100)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="#E8F8F0" stroke="#27AE60" stroke-width="2"/>
    <text x="110" y="20" text-anchor="middle" font-size="11" fill="#196F3D" font-weight="bold" font-family="Noto Serif SC, serif">解决方案</text>
    <text x="110" y="40" text-anchor="middle" font-size="10" fill="#333" font-family="Noto Serif SC, serif">VAD自动切分</text>
    <text x="110" y="53" text-anchor="middle" font-size="9" fill="#666" font-family="Noto Serif SC, serif">静音>500ms切分，单段≤30s</text>
  </g>
  
  <!-- 难点3：说话人分离 -->
  <g transform="translate(570, 20)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="#FDEDEC" stroke="#E74C3C" stroke-width="2"/>
    <text x="110" y="20" text-anchor="middle" font-size="11" fill="#C0392B" font-weight="bold" font-family="Noto Serif SC, serif">难点3</text>
    <text x="110" y="40" text-anchor="middle" font-size="10" fill="#333" font-family="Noto Serif SC, serif">说话人分离困难</text>
    <text x="110" y="53" text-anchor="middle" font-size="9" fill="#666" font-family="Noto Serif SC, serif">医患对话区分挑战大</text>
  </g>
  
  <!-- 箭头3 -->
  <g transform="translate(595, 80)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="#27AE60" stroke-width="3" marker-end="url(#greenArrow)"/>
  </g>
  
  <!-- 方案3 -->
  <g transform="translate(570, 100)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="#E8F8F0" stroke="#27AE60" stroke-width="2"/>
    <text x="110" y="20" text-anchor="middle" font-size="11" fill="#196F3D" font-weight="bold" font-family="Noto Serif SC, serif">解决方案</text>
    <text x="110" y="40" text-anchor="middle" font-size="10" fill="#333" font-family="Noto Serif SC, serif">CAM++声纹 + 交替映射</text>
    <text x="110" y="53" text-anchor="middle" font-size="9" fill="#666" font-family="Noto Serif SC, serif">声纹特征识别 + 兜底策略</text>
  </g>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="greenArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#27AE60"/>
    </marker>
  </defs>
</svg>