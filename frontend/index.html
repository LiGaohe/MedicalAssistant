<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>门诊病历生成系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>门诊病历生成系统</h1>
        
        <div class="upload-section">
            <div class="drop-zone" id="dropZone">
                <p>拖拽音频文件到此处</p>
                <p>或点击选择文件</p>
                <p class="hint">支持: wav, mp3</p>
                <input type="file" id="audioFile" accept=".wav,.mp3" hidden>
            </div>
            
            <div class="form-group">
                <label for="patientName">患者姓名:</label>
                <input type="text" id="patientName" placeholder="可选">
            </div>
            
            <div class="form-group">
                <label for="visitDate">就诊日期:</label>
                <input type="date" id="visitDate">
            </div>
            
            <div class="form-group">
                <label for="languageSelect">音频语言:</label>
                <select id="languageSelect">
                    <option value="zh">中文</option>
                    <option value="en">English</option>
                </select>
            </div>
            
            <div class="upload-actions">
                <button id="uploadBtn" class="btn-primary" disabled>开始上传</button>
                <button id="textDebugBtn" class="btn-success">文本调试模式</button>
                <button id="configBtn" class="btn-secondary">配置大模型</button>
            </div>
            
            <div class="progress-section" id="progressSection" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p id="progressText">上传进度: 0%</p>
            </div>
        </div>
    </div>
    
    <div id="textDebugModal" class="modal" style="display: none;">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>文本调试模式</h2>
                <span class="close" id="closeTextDebugModal">&times;</span>
            </div>
            <div class="modal-body">
                <div class="text-input-section">
                    <h3>输入对话文本</h3>
                    <div class="text-input-format-hint">
                        <p><strong>支持的格式：</strong></p>
                        <ul>
                            <li><strong>有说话人标签：</strong><code>[spk0]: 对话内容</code> 或 <code>[医生]: 对话内容</code></li>
                            <li><strong>无标签：</strong>每行一句话，系统会自动识别说话人</li>
                        </ul>
                    </div>
                    <div class="form-group">
                        <label for="debugLanguageSelect">对话语言:</label>
                        <select id="debugLanguageSelect">
                            <option value="zh">中文</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                    <textarea id="dialogTextInput" rows="12" placeholder="示例：
[spk0]: 我最近头痛三天了
[spk1]: 请问头痛的位置在哪里？
[spk0]: 主要是前额和太阳穴
[spk1]: 是持续性的还是阵发性的？

或无标签格式：
我最近头痛三天了
请问头痛的位置在哪里？
主要是前额和太阳穴
是持续性的还是阵发性的？"></textarea>
                    <div class="text-input-actions">
                        <button id="startTextDebug" class="btn-primary">开始调试</button>
                        <button id="cancelTextDebug" class="btn-secondary">取消</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/upload.js"></script>
</body>
</html>
