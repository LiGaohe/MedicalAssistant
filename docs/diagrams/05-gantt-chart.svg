<svg xmlns="http://www.w3.org/2000/svg" width="850" height="200" viewBox="0 0 850 200">
  <!-- 背景 -->
  <rect width="850" height="200" fill="#F8F7F2"/>
  
  <!-- 标题 -->
  <text x="425" y="20" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" font-family="Noto Serif SC, serif">项目进度甘特图</text>
  
  <!-- 时间轴 -->
  <g transform="translate(180, 45)">
    <line x1="0" y1="0" x2="640" y2="0" stroke="#333" stroke-width="1"/>
    <text x="0" y="-8" font-size="8" fill="#666" font-family="Noto Serif SC, serif">1月</text>
    <text x="100" y="-8" font-size="8" fill="#666" font-family="Noto Serif SC, serif">2月</text>
    <text x="200" y="-8" font-size="8" fill="#666" font-family="Noto Serif SC, serif">3月</text>
    <text x="300" y="-8" font-size="8" fill="#666" font-family="Noto Serif SC, serif">4月</text>
    <text x="400" y="-8" font-size="8" fill="#666" font-family="Noto Serif SC, serif">5月</text>
    <text x="500" y="-8" font-size="8" fill="#666" font-family="Noto Serif SC, serif">6月</text>
    <text x="600" y="-8" font-size="8" fill="#666" font-family="Noto Serif SC, serif">7月</text>
  </g>
  
  <!-- 当前时间线 -->
  <g>
    <line x1="480" y1="45" x2="480" y2="190" stroke="#E74C3C" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="485" y="55" font-size="8" fill="#E74C3C" font-family="Noto Serif SC, serif">当前</text>
  </g>
  
  <!-- 任务1：调研与架构设计 -->
  <g transform="translate(10, 60)">
    <text x="0" y="12" font-size="9" fill="#333" font-family="Noto Serif SC, serif">调研与架构设计</text>
    <rect x="170" y="0" width="200" height="16" rx="4" fill="#27AE60"/>
    <text x="270" y="12" text-anchor="middle" font-size="8" fill="#FFFFFF" font-family="Noto Serif SC, serif">已完成</text>
  </g>
  
  <!-- 任务2：ASR模块实现 -->
  <g transform="translate(10, 85)">
    <text x="0" y="12" font-size="9" fill="#333" font-family="Noto Serif SC, serif">ASR模块实现</text>
    <rect x="270" y="0" width="200" height="16" rx="4" fill="#27AE60"/>
    <text x="370" y="12" text-anchor="middle" font-size="8" fill="#FFFFFF" font-family="Noto Serif SC, serif">已完成</text>
  </g>
  
  <!-- 任务3：Web应用框架 -->
  <g transform="translate(10, 110)">
    <text x="0" y="12" font-size="9" fill="#333" font-family="Noto Serif SC, serif">Web应用框架</text>
    <rect x="270" y="0" width="200" height="16" rx="4" fill="#27AE60"/>
    <text x="370" y="12" text-anchor="middle" font-size="8" fill="#FFFFFF" font-family="Noto Serif SC, serif">已完成</text>
  </g>
  
  <!-- 任务4：术语纠错模块 -->
  <g transform="translate(10, 135)">
    <text x="0" y="12" font-size="9" fill="#333" font-family="Noto Serif SC, serif">术语纠错模块</text>
    <rect x="470" y="0" width="100" height="16" rx="4" fill="#F39C12"/>
    <text x="520" y="12" text-anchor="middle" font-size="8" fill="#FFFFFF" font-family="Noto Serif SC, serif">进行中</text>
  </g>
  
  <!-- 任务5：SOAP病历生成 -->
  <g transform="translate(10, 160)">
    <text x="0" y="12" font-size="9" fill="#333" font-family="Noto Serif SC, serif">SOAP病历生成</text>
    <rect x="570" y="0" width="100" height="16" rx="4" fill="#BDC3C7"/>
    <text x="620" y="12" text-anchor="middle" font-size="8" fill="#666" font-family="Noto Serif SC, serif">未开始</text>
  </g>
  
  <!-- 图例 -->
  <g transform="translate(720, 60)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#27AE60"/>
    <text x="18" y="10" font-size="8" fill="#666" font-family="Noto Serif SC, serif">已完成</text>
    <rect x="0" y="20" width="12" height="12" rx="2" fill="#F39C12"/>
    <text x="18" y="30" font-size="8" fill="#666" font-family="Noto Serif SC, serif">进行中</text>
    <rect x="0" y="40" width="12" height="12" rx="2" fill="#BDC3C7"/>
    <text x="18" y="50" font-size="8" fill="#666" font-family="Noto Serif SC, serif">未开始</text>
  </g>
</svg>