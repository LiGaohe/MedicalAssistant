<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="docGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="structureGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="90" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- 文档主体 -->
  <g transform="translate(35, 30)">
    <!-- 文档纸张 -->
    <rect x="0" y="0" width="90" height="110" rx="6" fill="url(#docGradient)" filter="url(#shadow)"/>
    
    <!-- 文档折角 -->
    <path d="M 70 0 L 90 0 L 90 20 Z" fill="#2d3748" opacity="0.3"/>
    
    <!-- 文档内容线条 -->
    <rect x="12" y="20" width="66" height="4" rx="2" fill="white" opacity="0.9"/>
    <rect x="12" y="32" width="50" height="3" rx="1.5" fill="white" opacity="0.7"/>
    <rect x="12" y="42" width="58" height="3" rx="1.5" fill="white" opacity="0.7"/>
    <rect x="12" y="52" width="44" height="3" rx="1.5" fill="white" opacity="0.7"/>
    
    <!-- 医疗十字标志（病历元素） -->
    <g transform="translate(15, 68)">
      <rect x="0" y="8" width="20" height="6" rx="1" fill="white"/>
      <rect x="7" y="1" width="6" height="20" rx="1" fill="white"/>
    </g>
    
    <!-- 底部结构化数据示意 -->
    <rect x="40" y="72" width="38" height="3" rx="1.5" fill="white" opacity="0.5"/>
    <rect x="40" y="80" width="30" height="3" rx="1.5" fill="white" opacity="0.5"/>
  </g>
  
  <!-- 结构化/数据流元素 -->
  <g transform="translate(125, 55)">
    <!-- 节点1 -->
    <circle cx="0" cy="0" r="8" fill="url(#structureGradient)" filter="url(#shadow)"/>
    <text x="0" y="3" text-anchor="middle" fill="white" font-size="8" font-weight="bold">1</text>
    
    <!-- 节点2 -->
    <circle cx="0" cy="35" r="8" fill="url(#structureGradient)" filter="url(#shadow)"/>
    <text x="0" y="38" text-anchor="middle" fill="white" font-size="8" font-weight="bold">2</text>
    
    <!-- 节点3 -->
    <circle cx="0" cy="70" r="8" fill="url(#structureGradient)" filter="url(#shadow)"/>
    <text x="0" y="73" text-anchor="middle" fill="white" font-size="8" font-weight="bold">3</text>
    
    <!-- 连接线 -->
    <line x1="0" y1="8" x2="0" y2="27" stroke="#764ba2" stroke-width="2" stroke-dasharray="3,2"/>
    <line x1="0" y1="43" x2="0" y2="62" stroke="#764ba2" stroke-width="2" stroke-dasharray="3,2"/>
    
    <!-- 向右箭头 -->
    <path d="M 8 70 L 20 70 L 17 67 M 20 70 L 17 73" stroke="#764ba2" stroke-width="2" fill="none"/>
  </g>
  
  <!-- 数据库/结构化存储图标 -->
  <g transform="translate(125, 140)">
    <ellipse cx="15" cy="5" rx="15" ry="5" fill="url(#structureGradient)" opacity="0.8"/>
    <path d="M 0 5 L 0 20 Q 15 25 30 20 L 30 5" fill="none" stroke="url(#structureGradient)" stroke-width="2"/>
    <ellipse cx="15" cy="20" rx="15" ry="5" fill="url(#structureGradient)" opacity="0.6"/>
    <line x1="0" y1="12" x2="30" y2="12" stroke="url(#structureGradient)" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- 连接弧线 -->
  <path d="M 115 100 Q 115 100 125 100" stroke="#cbd5e0" stroke-width="2" fill="none" stroke-dasharray="4,2" opacity="0.6"/>
  
</svg>